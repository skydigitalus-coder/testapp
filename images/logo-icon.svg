<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="iconGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="iconBoxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9" />
      <stop offset="100%" style="stop-color:#4c1d95" />
    </linearGradient>

    <linearGradient id="iconGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24" />
      <stop offset="50%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#d97706" />
    </linearGradient>

    <linearGradient id="iconLightRay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Mystical Glow -->
  <circle cx="50" cy="50" r="45" fill="url(#iconGlow)" />

  <!-- Light Rays -->
  <g opacity="0.6">
    <path d="M50 40 L45 10 L50 10 L50 40 Z" fill="url(#iconLightRay)" />
    <path d="M50 40 L35 15 L40 12 L50 40 Z" fill="url(#iconLightRay)" />
    <path d="M50 40 L65 15 L60 12 L50 40 Z" fill="url(#iconLightRay)" />
    <path d="M50 40 L55 10 L50 10 L50 40 Z" fill="url(#iconLightRay)" />
  </g>

  <!-- Box Lid -->
  <g>
    <path d="M30 35 L70 35 L68 28 L32 28 Z" fill="url(#iconBoxGradient)" />
    <path d="M30 35 L70 35 L70 40 L30 40 Z" fill="url(#iconBoxGradient)" />
    <rect x="47" y="30" width="6" height="4" rx="1" fill="url(#iconGoldGradient)" />
  </g>

  <!-- Box Body -->
  <g>
    <rect x="32" y="40" width="36" height="30" fill="url(#iconBoxGradient)" />
    <path d="M68 40 L73 43 L73 73 L68 70 Z" fill="#4c1d95" />
    <path d="M32 40 L68 40 L73 43 L37 43 Z" fill="#8b5cf6" />
    <rect x="36" y="44" width="28" height="22" fill="none" stroke="url(#iconGoldGradient)" stroke-width="1.5" />

    <!-- Keyhole -->
    <circle cx="50" cy="55" r="4" fill="url(#iconGoldGradient)" />
    <circle cx="50" cy="55" r="2" fill="#000" opacity="0.6" />
    <path d="M49 55 L49 60 L51 60 L51 55" fill="#000" opacity="0.6" />
  </g>

  <!-- Shadow -->
  <ellipse cx="52" cy="72" rx="20" ry="3" fill="#000" opacity="0.3" />

  <!-- Sparkles -->
  <g fill="#fbbf24" opacity="0.8">
    <path d="M20 30 L20.5 31.5 L22 32 L20.5 32.5 L20 34 L19.5 32.5 L18 32 L19.5 31.5 Z" />
    <path d="M80 25 L80.5 26.5 L82 27 L80.5 27.5 L80 29 L79.5 27.5 L78 27 L79.5 26.5 Z" />
    <path d="M15 55 L15.3 56 L16 56.3 L15.3 56.6 L15 57.5 L14.7 56.6 L14 56.3 L14.7 56 Z" />
  </g>
</svg>
